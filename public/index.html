<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventario</title>
</head>
<body>
    <script src="js/Producto.js"></script>
    <script src="js/Inventario.js"></script>

    <div id="contenedor-formulario">
        <form>
            <label for="txtCod">
                Codigo: <input type="text" id="txtCod">
            </label>
            <label for="txtNom">
                Nombre: <input type="text" id="txtNom">
            </label>
            <label for="txtCant">
                Cantidad: <input type="number" id="txtCant">
            </label>
            <label for="txtPrecio">
                Precio: <input type="number" id="txtPrecio">
            </label>
            <button type="button" id="btnAdd">Agregar</button>
            <button type="button" id="btnFin">Buscar</button>
            <button type="button" id="btnDele">Eliminar</button>
            <button type="button" id="btnAggIni">Agregar Inicio</button>
            <button type="button" id="extPrim">Extraer Primero</button>
            <button type="button" id="btnList">Listar</button>
            <button type="button" id="btnListInv">Listar Inverso</button> 
        </form>
    </div>
    <hr>
    <h3>Detalles de Operaciones:</h3>
    <div id="detalles"></div>

    <script>
        const inv = new Inventario();
        const divDetalles = document.getElementById("detalles");

        document.getElementById("btnAdd").addEventListener("click", () => {
            let codigo = document.getElementById("txtCod").value;
            let nombre = document.getElementById("txtNom").value;
            let cantidad = document.getElementById("txtCant").value;
            let precio = document.getElementById("txtPrecio").value;
            
            let nuevo = new Producto(codigo, nombre, cantidad, precio);
            inv.agregar(nuevo);
            divDetalles.innerHTML += `<div><strong>Se agregó:</strong> ${nuevo.infoHtml()}</div>`;
        });

        document.getElementById("btnAggIni").addEventListener("click", () => {
            let codigo = document.getElementById("txtCod").value;
            let nombre = document.getElementById("txtNom").value;
            let cantidad = document.getElementById("txtCant").value;
            let precio = document.getElementById("txtPrecio").value;
            
            let nuevo = new Producto(codigo, nombre, cantidad, precio);
            inv.agregarInicio(nuevo);
            divDetalles.innerHTML += `<div><strong>Se agregó al inicio:</strong> ${nuevo.infoHtml()}</div>`;
        });

        document.getElementById("btnFin").addEventListener("click", () => {
            let codigo = document.getElementById("txtCod").value;
            let encontrado = inv.buscar(codigo);
            if (encontrado) {
                divDetalles.innerHTML += `<div><strong>Producto encontrado:</strong> ${encontrado.infoHtml()}</div>`;
            } else {
                divDetalles.innerHTML += `<div><strong>Buscar:</strong> No se encontró el producto con código ${codigo}.</div>`;
            }
        });

        document.getElementById("btnDele").addEventListener("click", () => {
            let codigo = document.getElementById("txtCod").value;
            let eliminado = inv.eliminar(codigo);
            if (eliminado) {
                divDetalles.innerHTML += `<div><strong>Producto eliminado:</strong> ${eliminado.infoHtml()}</div>`;
            } else {
                divDetalles.innerHTML += `<div><strong>Eliminar:</strong> No se encontró el producto con código ${codigo} para eliminar.</div>`;
            }
        });

        document.getElementById("extPrim").addEventListener("click", () => {
            let extraido = inv.extraerPrimero();
            if (extraido) {
                divDetalles.innerHTML += `<div><strong>Primer producto extraído:</strong> ${extraido.infoHtml()}</div>`;
            } else {
                divDetalles.innerHTML += `<div><strong>Extraer primero:</strong> El inventario ya está vacío.</div>`;
            }
        });

        document.getElementById("btnList").addEventListener("click", () => {
            divDetalles.innerHTML += `<div><strong>Listado completo:</strong> <br> ${inv.listar()}</div>`;
        });

        document.getElementById("btnListInv").addEventListener("click", () => {
            divDetalles.innerHTML += `<div><strong>Listado inverso:</strong> <br> ${inv.listarInverso()}</div>`;
        });
    </script>

    <script src="js/app.js"></script>
</body>
</html>
